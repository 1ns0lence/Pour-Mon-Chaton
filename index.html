<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valentine's Day</title>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Great+Vibes&display=swap" rel="stylesheet">
</head>
<body>
    
    <div class="container">
        <h1>Coucouuu MON GROS CHAT, je dois te demander quelque chose..</h1>
        <p>Est-ce que tu veux être ma valentine ? T'as pas trop le choix de toute manière..</p>
        
        <img src="images/ChatFleur.jpg" alt="Chat avec fleurs" class="cat-image">
        
        <div id="status-message"></div>

        <div class="button-container">
            <button class="btn-oui">Oui</button>
            <button class="btn-non">Non</button>
        </div>
        <p class="signature">Fait avec amour par Elias</p>

    </div>

    <span class="heart-decor" style="top:10%; left:10%;">❤️</span>
    <span class="heart-decor" style="top:20%; right:15%; animation-delay: 2s;">❤️</span>
    <span class="heart-decor" style="bottom:15%; left:20%; animation-delay: 1s;">✨</span>
    <span class="heart-decor" style="top:50%; left:5%; font-size: 3rem;">❤️</span>
<span class="heart-decor" style="top:80%; right:10%; animation-delay: 3s;">✨</span>
<span class="heart-decor" style="top:15%; left:80%; font-size: 0.8rem;">❤️</span>
<span class="heart-decor" style="bottom:5%; left:45%; animation-delay: 4s;">✨</span>

    <script src="script.js"></script>
</body>
</html>
